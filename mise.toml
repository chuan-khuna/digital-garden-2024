[tools]
bun = "1.4.4"
just = "1.59.0"
node = "26"

[tasks.skills]
description = "Install the vendored agent skills"
run = [
  "bunx skills add mattpocock/skills#v1.3.2",
  "bunx skills add thananon/9arm-skills",
]

[tasks.plugins]
description = "Install the local writing-tools plugin (garden-local marketplace)"
run = [
  "claude plugin marketplace add ./.claude-dev --scope project",
  "claude plugin install writing-tools@garden-local --scope project",
  "claude plugin update writing-tools@garden-local --scope project",
]
